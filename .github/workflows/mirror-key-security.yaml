name: mirror-key-security

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'pkg/repository/**'
      - 'server/**'
      - 'tests/security/**'
      - '.github/workflows/mirror-key-security.yaml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  mirror-key-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Repository, CLI and server regressions
        run: go test -race ./pkg/repository/... ./cmd ./server/...
      - name: Build local tools
        run: |
          go build -o bin/tiup .
          go build -o bin/tiup-server ./server
      - name: Offline init, publish, clone and migration
        run: python3 tests/security/mirror_key_layout.py bin/tiup bin/tiup-server
