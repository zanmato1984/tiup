name: server-private-files

on:
  pull_request:
    paths:
      - 'server/**'
      - 'pkg/repository/**'
      - 'tests/tiup-server/**'
      - 'tests/Makefile'
      - 'Makefile'
      - '.github/workflows/server-private-files.yaml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  server-private-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Server boundary and repository regressions
        run: go test -race ./server/... ./pkg/repository/...
      - name: Existing layouts, signing and private HTTP denial
        run: make test_server_private_files

  unicode-alias:
    # macos-latest arm64 exhausted hosted capacity before this job could start.
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Require a non-skipped Unicode alias regression
        run: |
          go test -json -count=1 -run '^TestStaticServerUnicodeKeyDirectoryAlias$' ./server | tee unicode-alias.json
          jq -e -s 'any(.[]; .Test == "TestStaticServerUnicodeKeyDirectoryAlias" and .Action == "pass")' unicode-alias.json
