name: server-private-files

on:
  pull_request:
    paths:
      - 'server/**'
      - 'pkg/repository/**'
      - 'tests/security/server_private_files.py'
      - '.github/workflows/server-private-files.yaml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  server-private-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Server boundary and repository regressions
        run: go test -race ./server/... ./pkg/repository/...
      - name: Build existing CLI and patched server
        run: |
          go build -o bin/tiup .
          go build -o bin/tiup-server ./server
      - name: Existing layouts, signing and private HTTP denial
        run: python3 tests/security/server_private_files.py bin/tiup bin/tiup-server
